; Metadata for legacy tools (older pip, bdist_rpm, stdeb, fpm) that still
; read setup.cfg. pyproject.toml is the source of truth for everything a
; build uses: dependencies, extras and the licence are declared only there (0.73.0) --
; setuptools discarded these copies on every build ("install_requires
; overwritten in pyproject.toml"), so they could only ever drift.

[metadata]
name = hypernix
version = 0.72.8.post2
description = Download and quantize the HyperNix PyTorch model to GGUF (fp32/fp16/Q8_0/Q6_K/Q4_K_M).
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/trail-b1az3r/hypernix-pip
author = HyperNix contributors
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Operating System :: OS Independent
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Operating System :: Microsoft :: Windows
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12,<3.16
include_package_data = True

[options.packages.find]
where = src
include = hypernix*

[options.entry_points]
console_scripts =
    hypernix = hypernix.interfaces.cli:main
    hypernix-quantize = hypernix.interfaces.cli:main
    hnx = hypernix.interfaces.cli:main
    tvtop++ = hypernix.monitoring.tvtop_plus_plus:cli_main
    tvtoppp = hypernix.monitoring.tvtop_plus_plus:cli_main
