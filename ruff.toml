line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# ``hypernix`` is this project's own code. Say so explicitly rather
# than letting isort infer it from the filesystem: modules are
# reachable both as ``hypernix.timer`` and ``hypernix.timing.timer``,
# and only the second spelling has a matching path on disk.
[lint.isort]
known-first-party = ["hypernix"]

# FastAPI's dependency-injection pattern relies on calling Depends()/File()
# etc. in argument defaults; ruff's bugbear check flags this by default
# (B008) even though FastAPI treats these calls as idempotent markers, not
# actual eager evaluation. This is the documented FastAPI/ruff exception.
[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Cookie",
]

# These deprecated modules intentionally announce themselves before
# their imports, so the message fires even if the rest of the module
# fails to load -- and, for the ones that import torch, without waiting
# several seconds for it. That ordering is the point, not an oversight.
# The announcement itself is hypernix.system.deprecation, which imports
# nothing heavier than os, sys and warnings.
[lint.per-file-ignores]
"src/hypernix/data/mediocre_fridge.py" = ["E402"]
"src/hypernix/evaluation/new_fridge.py" = ["E402"]
"src/hypernix/system/old_fridge.py" = ["E402"]
"src/hypernix/models/old_oven.py" = ["E402"]
"src/hypernix/monitoring/tvtop.py" = ["E402"]
