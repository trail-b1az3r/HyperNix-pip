[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypernix"
version = "0.72.3.post8"
description = "Download and quantize the HyperNix PyTorch model to GGUF (fp32/fp16/Q8_0/Q6_K/Q4_K_M)."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "HOL-1.0" }
# Python 3.12 is preferred and will auto-run if installed.
# If 3.12 is not found, the package supports running on 3.13 or 3.14.
# The code is pure-Python and runs on any CPython that has a compatible torch wheel.
# Keep the floor at 3.10 so modern syntax compiles (structural pattern matching, PEP 604 unions).
requires-python = ">=3.10,<3.15"
authors = [{ name = "HyperNix contributors" }]
keywords = ["hypernix", "gguf", "quantization", "llama.cpp", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # torch floor is 1.13 (the last 1.x release, needed for old Intel
    # Macs; see hypernix.torch_compat for the version-gated RMSNorm /
    # SDPA fallbacks).  2.7+ is still the *recommended* version for
    # native nn.RMSNorm and the fused SDPA path, but the code runs
    # correctly from 1.13 upwards.  No upper bound on 2.x.
    # CUDA 11 users: install from the cu118 index first, e.g.
    #   pip install --index-url https://download.pytorch.org/whl/cu118 torch
    # then `pip install hypernix` will reuse that torch rather than pulling
    # a CUDA-12 wheel.
    "torch>=1.13,<3",
    "numpy>=1.26,<3",
    "safetensors>=0.4.3",
    "huggingface-hub>=0.24",
    "gguf>=0.10.0",
    "tqdm>=4.66",
    "rich>14,<=15.0.0",
    # 0.2.1 is the first release with cp313 wheels; stick with it so a
    # fresh Python 3.13 env doesn't need a C++ toolchain to build from src.
    "sentencepiece>=0.2.1",
]

[project.optional-dependencies]
llama-cpp = ["llama-cpp-python>=0.2.90"]
train = ["transformers>=4.44", "accelerate>=0.33"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2", "twine>=5"]
# v0.71.0: optional encryption backend for Keymaster key storage.
# When not installed, Keymaster falls back to plain JSON storage with
# a warning. Install with: pip install hypernix[security]
security = ["cryptography>=42"]
# v0.71.5b1: HyperNix T1 API — hypernix.t1api.create_app() and the
# `waiter` console script's server-side dependencies. hypernix.t1api's
# core (registry/storage/usage/auth/config/errors) has NO dependency on
# this extra and imports fine without it; only hypernix.t1api.create_app
# (and hypernix.t1api.app/.schemas/.deps/.routers) require it. The
# `waiter` CLI itself is a client and does NOT need this extra — it talks
# HTTP via stdlib urllib. Install with: pip install hypernix[t1api]
t1api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    # v0.71.5b2: required at runtime by FastAPI's UploadFile/File() —
    # used by POST /modules/upload/local. Not imported directly anywhere
    # in hypernix, but FastAPI raises at request time without it installed.
    "python-multipart>=0.0.9,<1",
]
# v0.71.5b3: PostgreSQL backend for production T1 API deployments
# (T1_DATABASE_URL). SQLite stays the zero-config development default and
# needs nothing extra; this is only required when that variable is set.
# psycopg_pool is what turns the per-call connections into a pool — the
# backend works without it, just one connection per call.
t1api-pg = ["psycopg[binary,pool]>=3.1,<4"]
# Test-only deps for the t1api/waiter suites beyond the base `dev` extra
# (httpx is FastAPI TestClient's transport; the rest come from `dev`+`t1api`).
t1api-test = ["hypernix[dev,t1api]", "httpx>=0.27,<1"]
# Old Intel Macs / anywhere torch 2.x won't install.  This extra does
# NOT relax the main torch pin — the compat shims in
# ``hypernix.torch_compat`` run on torch 1.13+, but you must pin
# torch *before* installing hypernix (see
# ``scripts/install_macos_legacy.sh``).  The extra pulls the smaller
# companion deps in versions known to work with torch 1.13.
legacy-torch = [
    "numpy>=1.21,<2",
    "safetensors>=0.3.1",
    "huggingface-hub>=0.16",
    "tqdm>=4.64",
    "sentencepiece>=0.1.99",
]
# v0.71.4b6: hyped-pro desktop GUI (`hypernix.hyped_pro_gui`, launched via
# `hyped-pro-gui` or the TUI's /gui command). Qt6 covers both X11 and
# Wayland from one dependency; GTK4 is an independent fallback for
# GTK-only systems where PySide6 isn't wanted. Install whichever backend
# you want — the GUI picks Qt6 first, then GTK4, and prints a clear error
# if neither is present.
gui-qt = ["PySide6>=6.6"]
gui-gtk = ["PyGObject>=3.48"]
gui = ["hypernix[gui-qt]"]

[project.scripts]
hypernix = "hypernix.interfaces.version_launcher:main"
hypernix-quantize = "hypernix.interfaces.version_launcher:main"
hnx = "hypernix.interfaces.version_launcher:main"
# v0.70.4b12: cctvtop C++ dashboard replaces tvtop++.
tvtop = "hypernix.monitoring.cctvtop:cli_main"
cctvtop = "hypernix.monitoring.cctvtop:cli_main"
tvtop-old = "hypernix.monitoring.tvtop_plus_plus:cli_main"
tvtop-older = "hypernix.monitoring.tv:cli_main"
tvtop-plus-plus = "hypernix.monitoring.tvtop_plus_plus:cli_main"
tvtoppp = "hypernix.monitoring.tvtop_plus_plus:cli_main"
# 0.72.3.post2: tvtop++'s stats, btop++'s presentation, themes. Not
# built on cctvtop -- it takes TVTopPlusPlus as a stat source only.
tvtoppro = "hypernix.monitoring.tvtoppro:cli_main"
tvtop-pro = "hypernix.monitoring.tvtoppro:cli_main"
eth = "hypernix.system.ethanol:cli_main"
# v0.71.5b3: ups had no entry point at all — a complete module that
# nothing could run.
ups = "hypernix.system.ups:cli_main"
# v0.61.1: high-quality TUI chat CLI with a configurator.
hyped = "hypernix.interfaces.hyped:cli_main"
hyped-pro = "hypernix.interfaces.hyped_pro:cli_main"
hyped-plus = "hypernix.interfaces.hyped_pro:cli_main"
# v0.71.4b6: hyped-pro's desktop GUI (Qt6 X11/Wayland, GTK4 fallback).
hyped-pro-gui = "hypernix.interfaces.hyped_pro_gui:cli_main"
# v0.71.4b7: unified interface over multiple llama.cpp variants (vanilla,
# ik_llama.cpp, PrismML fork, KoboldCpp) for broader GGUF model support.
multilama = "hypernix.models.multilama:cli_main"
# v0.71.0: unified Gatekeeper + Keymaster CLI.
gkey = "hypernix.security.gkey_cli:main"
# 0.72.3 pt2: the sub-bit quantiser. Four names because people type all
# four; one implementation.
hyprslug = "hypernix.quant.hyprslug_cli:cli_main"
doomslug = "hypernix.quant.hyprslug_cli:cli_main"
doomslugthedestroyer = "hypernix.quant.hyprslug_cli:cli_main"
dstd = "hypernix.quant.hyprslug_cli:cli_main"
hnx-imatrix = "hypernix.quant.imatrix_cli:cli_main"
# 0.72.3.post2: self-describing headers, the compat export, and the
# OpenAI-compatible server that lets LM Studio reach a sub-bit model
# without converting it.
hyprslug-headers = "hypernix.quant.hyprslug_headers_cli:cli_main"
hnx-headers = "hypernix.quant.hyprslug_headers_cli:cli_main"
# 0.72.3 pt3: the embedded draft model, for speculative decoding.
dflash2 = "hypernix.quant.dflash2_cli:cli_main"
# v0.71.5b1: HyperNix T1 API's official client TUI/CLI. Zero-extra-deps
# client (stdlib urllib) — does NOT require `pip install hypernix[t1api]`,
# that extra is only for running the server (hypernix.t1api.create_app()).
waiter = "hypernix.waiter.cli:main"
# v0.71.1: steampunk schematic TUI (dials/pipes/steam for model + training state).
hnx-map = "hypernix.monitoring.map:cli_main"
# 0.72.1: the training-script builder (GUI, with a headless CLI fallback).
hnx-scriptgen = "hypernix.scriptgen.cli:cli_main"
scriptgen = "hypernix.scriptgen.cli:cli_main"
# 0.72.1: steamroller, the descending llama.cpp quantiser.
steamroller = "hypernix.quant.steamroller_cli:cli_main"
# 0.72.1: noodle, the autonomous multi-agent executor inside hyped-pro.
noodle = "hypernix.interfaces.noodle.cli:cli_main"

[project.urls]
Homepage = "https://trail-b1az3r.github.io/HyperNix-pip/"
Source = "https://github.com/trail-b1az3r/hypernix-pip"
Issues = "https://github.com/trail-b1az3r/hypernix-pip/issues"
Logo = "https://raw.githubusercontent.com/trail-b1az3r/hypernix-pip/main/assets/logo.png"

# ---------------------------------------------------------------------------
# Setuptools: src/ layout + include extra files in the sdist via MANIFEST.in
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true
# hypernix-t1 is a shell program, not a Python entry point, so it cannot
# go in [project.scripts]. script-files puts it on PATH alongside the
# console scripts, which is what the documentation promises — without it,
# `pip install hypernix` gives you every other companion script and not
# this one.
script-files = ["bin/hypernix-t1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hypernix*"]

[tool.setuptools.package-data]
hypernix = ["py.typed", "webui_static/*", "*.js", "t1api/data/*.json"]

# ---------------------------------------------------------------------------
# Ruff / pytest defaults (also duplicated in ruff.toml / pytest.ini so
# editors pick them up regardless of project layout).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hypernix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

