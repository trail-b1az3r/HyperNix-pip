[general]
name = "llama-essir"
version = 1
edition = 6
# The repository's own licence (see LICENSE at its root) -- not a stock
# SPDX licence, so the Hub records it as "other".
license = "other"
backends = [
    "cpu",
    "cuda",
    "rocm",
]

[general.hub]
repo-id = "ray0rf1re/llama-essir"

# Triton and plain PyTorch only: nothing is compiled ahead of time, so one
# build per backend runs on every Torch and every GPU generation.
[torch-noarch]
