[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: takes seconds rather than milliseconds — trainers run against a
        real environment until they reach a known score. Deselect with
        `-m "not slow"`; they are in the default run because a trainer
        nobody runs end to end is a trainer nobody has tested.
