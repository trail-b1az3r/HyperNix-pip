# nginx front end for the HyperNix T1 API.
#
# Terminates TLS and, when you uncomment the mTLS block, client
# certificates too — then tells the API what it verified through the
# X-Client-* headers that t1api.mtls reads.
#
# The API only believes those headers from an address in
# T1_TRUSTED_PROXIES. Set that to this proxy's address (in the compose
# stack, the bridge network) or the headers are ignored and every request
# is refused as if no certificate were presented. That is the intended
# failure direction: a forgeable header is worse than a broken deploy.

upstream t1api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # /health over plain HTTP so a load balancer can poll without TLS.
    # It exposes liveness and nothing else.
    location /health { proxy_pass http://t1api; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- mTLS (optional) ---------------------------------------------------
    # Uncomment both lines and set T1_MTLS_REQUIRE_CLIENT_CERT=1 to require
    # client certificates. `optional` rather than `on` lets the /health
    # location below stay reachable for health checks; the API enforces the
    # requirement per-path and exempts /health itself.
    #
    # ssl_client_certificate /etc/nginx/tls/client-ca.crt;
    # ssl_verify_client      optional;

    # Uploads and module transfers are bounded by the API
    # (T1_MAX_TRANSFER_BYTES); this keeps nginx from buffering something
    # larger than the API would ever accept.
    client_max_body_size 256m;

    location / {
        proxy_pass http://t1api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # What the API's mTLS layer reads. Set unconditionally: when
        # client verification is off these are empty, and an empty
        # X-Client-Verify is not "SUCCESS", so it fails closed rather than
        # being absent and ambiguous.
        proxy_set_header X-Client-Verify      $ssl_client_verify;
        proxy_set_header X-Client-Subject-DN  $ssl_client_s_dn;
        proxy_set_header X-Client-Issuer-DN   $ssl_client_i_dn;
        proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;

        # GET /events/stream, streamed chats, /v1/messages (Claude Code)
        # and /mcp are Server-Sent Events. Buffering them would hold every
        # event until the response closed, which for a live tail is the
        # same as it not working.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
