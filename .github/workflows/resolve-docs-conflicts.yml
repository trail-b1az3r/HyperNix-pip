name: Resolve docs data conflicts

# docs/public/v1 is generated data that "Update Docs Data" and "Update
# JSON Stats" rewrite on main every hour, so a pull request that also
# touched it conflicts with main though nobody edited a line. This merges
# the base branch into each open pull request and, when the only conflicts
# are in docs/public/v1, settles every file by taking the version from the
# branch that changed it most recently, then pushes the merge. A conflict
# anywhere else is left for a person: nothing is pushed, and the pull
# request gets a comment naming the files.
#
# It runs when a pull request is opened, reopened or updated, after the
# hourly jobs rewrite the data on main, when someone pushes docs data to
# main, and by hand (one pull request, or all of them).
#
# Pushes made with the built-in token do not start other workflows, so CI
# does not re-run on the merge it pushes. Set the AUTOFIX_TOKEN secret (a
# token that can push to this repository) and the merge is pushed with it
# instead, and CI runs on it as on any other push.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Update Docs Data", "Update JSON Stats", "Public T1 server counter"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/public/v1/**"]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (empty: every open pull request)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  targets:
    name: find pull requests
    runs-on: ubuntu-latest
    # After an hourly job, only if it actually ran to the end.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            prs="[$PR]"
          else
            # Branches in this repository only: a fork's branch cannot be pushed to.
            prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == "'"$GITHUB_REPOSITORY"'") | .number' | jq -sc .)
          fi
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "pull requests: $prs"

  resolve:
    name: "PR #${{ matrix.pr }}"
    needs: targets
    if: needs.targets.outputs.prs != '[]' && needs.targets.outputs.prs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.targets.outputs.prs) }}
    concurrency:
      group: resolve-docs-conflicts-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      - name: Look up the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr }}
        run: |
          info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$info")
          state=$(jq -r .state <<<"$info")
          skip=false
          if [ "$state" != open ]; then
            echo "::notice::#$PR is $state; skipping."; skip=true
          elif [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::#$PR comes from a fork ($head_repo), which this cannot push to; skipping."; skip=true
          fi
          {
            echo "skip=$skip"
            echo "head=$(jq -r .head.ref <<<"$info")"
            echo "base=$(jq -r .base.ref <<<"$info")"
          } >> "$GITHUB_OUTPUT"

      # The pull request's files are checked out as *data*: git merges
      # them, and nothing from them is run (CodeQL "checkout of untrusted
      # code in a privileged context"). This job holds a write token and
      # starts from workflow_run, so a script, a requirements file or a
      # Python module in the branch must never get to execute here. The
      # token is not left in the checkout either; only the push gets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.skip == 'false'
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.pr.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Merge the base branch, settling docs/public/v1
        id: resolve
        if: steps.pr.outputs.skip == 'false'
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$BASE"
          # The resolver as reviewed on the base branch, never the pull
          # request's copy (which this job would otherwise run with a write
          # token), and run isolated (-I): no imports from the checkout, no
          # PYTHON* variables.
          if ! git show "origin/$BASE:scripts/ci/resolve_docs_conflicts.py" > "$RUNNER_TEMP/resolve.py"; then
            echo "::error::$BASE has no scripts/ci/resolve_docs_conflicts.py; nothing to run."
            exit 1
          fi
          set +e
          python -I "$RUNNER_TEMP/resolve.py" --base "origin/$BASE" --paths docs/public/v1 \
            --summary "$RUNNER_TEMP/summary.md" | tee "$RUNNER_TEMP/out.txt"
          status=${PIPESTATUS[0]}
          set -e
          outcome=$(sed -n 's/^outcome: //p' "$RUNNER_TEMP/out.txt")
          echo "outcome=${outcome:-error}" >> "$GITHUB_OUTPUT"
          [ -f "$RUNNER_TEMP/summary.md" ] && cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # 2 is "conflicts a person must settle": reported, not a failure.
          [ "$status" = 0 ] || [ "$status" = 2 ]

      - name: Push the merge
        if: steps.resolve.outputs.outcome == 'resolved'
        env:
          HEAD: ${{ steps.pr.outputs.head }}
          PUSH_TOKEN: ${{ secrets.AUTOFIX_TOKEN || github.token }}
        run: |
          # The token for this one command, as a header in git's environment
          # config, not stored in .git/config.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD"

      - name: Say what happened on the pull request
        if: steps.resolve.outputs.outcome == 'resolved' || steps.resolve.outputs.outcome == 'blocked'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr }}
        run: |
          marker='<!-- resolve-docs-conflicts -->'
          {
            echo "$marker"
            echo "### Generated docs data conflicts"
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "<sub>[Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · \`.github/workflows/resolve-docs-conflicts.yml\`</sub>"
          } > "$RUNNER_TEMP/comment.md"
          # One comment per pull request, updated in place, rather than a new one every run.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          fi
