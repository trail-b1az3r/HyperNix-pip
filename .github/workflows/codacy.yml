# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '37 19 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # The analysis crashed on every run since 2026-09-08, inside its SARIF
      # writer (java.nio.charset.MalformedInputException): it reads each
      # flagged file with the JVM's default charset, which in its container
      # is ASCII, and this repository's files are UTF-8 with non-ASCII text.
      # codacy-analysis-cli-action passes only four fixed variables into the
      # container, so the same pinned CLI is run here with the charset set.
      - name: Run Codacy Analysis CLI
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_ANALYSIS_CLI_VERSION: "4.0.0"
        run: |
          token=()
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then token=(--project-token "$CODACY_PROJECT_TOKEN"); fi
          docker run --rm \
            --env CODACY_CODE="$PWD" \
            --env JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8" \
            --env LANG=C.UTF-8 --env LC_ALL=C.UTF-8 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD":"$PWD" \
            --volume /tmp:/tmp \
            "codacy/codacy-analysis-cli:${CODACY_ANALYSIS_CLI_VERSION}" -- \
            analyze --directory "$PWD" --verbose "${token[@]}" \
              --format sarif --output "$PWD/results.sarif" \
              --max-allowed-issues 2147483647 --gh-code-scanning-compat

      # GitHub refuses a SARIF run over 25,000 results, and pylint alone has
      # 37,000 here. Keep the security findings, errors and warnings; drop
      # formatting. The job summary lists what was kept per tool.
      - name: Keep the SARIF to security findings and GitHub's limits
        run: python3 .github/scripts/codacy_sarif_filter.py results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
