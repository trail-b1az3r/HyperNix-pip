name: public-release

# One-click public release — does EVERYTHING in this single workflow so we
# don't depend on the tag push firing a second workflow (GITHUB_TOKEN-pushed
# tags intentionally don't trigger downstream workflows on GitHub).
#
#   1. Manual dispatch with a version (e.g. 0.2.0 or 0.2.0-rc1).
#   2. Updates pyproject.toml + setup.cfg + src/hypernix/__init__.py so the
#      three version strings stay in sync.
#   3. Runs lint + tests + `python -m build` + `twine check` so we never
#      tag a broken state.
#   4. Commits the version bump to the trigger branch (skip-ci-tagged).
#   5. Creates an annotated tag `v<version>` and pushes it.
#   6. Downstream jobs (github-release, pypi-publish, testpypi-publish)
#      consume the built artifact and create the GitHub Release + publish
#      to PyPI (stable) or TestPyPI (prerelease) via Trusted Publishing.
#
# Net effect: kick this off once from the Actions tab and a public release
# lands on PyPI with `pip install hypernix` working immediately after.
#
# Prereqs (one-time, by the repo owner):
#   - Register Trusted Publishing on PyPI at
#     https://pypi.org/manage/account/publishing/:
#       project = hypernix
#       owner   = <your_gh_org>
#       repo    = hypernix-pip
#       workflow = public-release.yml
#       environment = pypi
#   - Same for TestPyPI (environment = testpypi) if you want prerelease
#     publishing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, without the leading v (e.g. 0.2.0, 0.2.0-rc1, or 0.70.6-2 to rebuild/re-publish an already-released version as build 2)."
        required: true
        type: string
      dry_run:
        description: "Validate + build but skip the commit, tag push, and publish."
        type: boolean
        default: false
      skip_pypi:
        description: "Tag + GitHub Release but skip PyPI / TestPyPI publishing."
        type: boolean
        default: false
      allow_downgrade:
        description: "Publish a version LOWER than the one already in the tree. Only for undoing a bad release -- normally leave off."
        type: boolean
        default: false
      skip_integration:
        description: "Skip BOTH live-server integration jobs (API + iPhone simulator). They are the gate that proves a real server accepts a real key before anything publishes — only for a runner outage, never to get past a red test."
        type: boolean
        default: false

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Validate, build, test, tag, push. Uploads dist/ as an artifact the
  # downstream publish jobs consume.
  # ---------------------------------------------------------------------------
  cut:
    name: cut public release v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write    # commit version bump + push tag
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      tag: ${{ steps.classify.outputs.tag }}
    steps:
      - name: Validate version format
        run: |
          v='${{ inputs.version }}'
          # PEP 440 allows: N.N.N, N.N.NaN, N.N.NbN, N.N.NrcN, N.N.N.postN, N.N.N.devN
          # We map 'postr' to '.post' for PEP 440 compliance during build.
          # We also accept a bare "-N" rebuild suffix (e.g. 0.70.6-2), meaning
          # "build N of an already-released version" -- mapped to PEP 440's
          # .postN below and published as a normal stable release, not a
          # prerelease (see the -N branch in the classify step).
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+|([._-]?(rc|pre|alpha|beta|a|b|post|postr|dev)[0-9]*))?$ ]]; then
            echo "::error::version '$v' is not PEP 440-ish (e.g. 0.2.0, 0.2.0-rc1, 0.2.0a2, 0.2.0postr1, 0.70.6-2)"
            exit 1
          fi

      - name: Classify release (stable vs prerelease)
        id: classify
        run: |
          v='${{ inputs.version }}'
          tag="v$v"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            # e.g. 0.70.6-2 -- a rebuild of an already-released version
            # (PyPI post-release). Still a public, stable release -> PyPI,
            # not TestPyPI.
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is a rebuild of an existing version (-> PyPI, as a post-release)"
          # Treat postr as a post-release (prerelease for PyPI purposes)
          elif [[ "$v" =~ (rc|pre|alpha|beta|a|b|postr)[0-9]*$ ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is a prerelease (-> TestPyPI)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is a stable release (-> PyPI)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "packaging>=24.2"
          pip install "build>=1.2" "twine>=6" "ruff>=0.5" "pytest>=8" "setuptools>=77" wheel

      - name: Install torch (CPU wheels) + package
        # pytest needs torch (hypernix imports it at module load). Install the
        # CPU wheel explicitly rather than relying on the package install
        # below to pull it, so we never accidentally fetch a GPU build.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Refuse a version that goes backwards
        # This workflow writes whatever version it is handed, so a
        # dispatch naming an older one silently downgrades main. It has
        # happened: v0.72.3.post2 was dispatched against a tree already
        # at 0.72.3.post4 and rewrote all three version strings to the
        # older number, leaving main claiming a release that predates the
        # code in it. Nothing downstream can detect that -- the built
        # wheel is internally consistent, it is just wrong about which
        # release it is.
        if: ${{ !inputs.allow_downgrade }}
        run: |
          python - <<'GUARD'
          import re, sys
          from pathlib import Path
          from packaging.version import Version, InvalidVersion

          requested = "${{ inputs.version }}"
          pep440 = requested.replace("postr", "post")
          if re.fullmatch(r"\d+\.\d+\.\d+-\d+", pep440):
              base, build = pep440.rsplit("-", 1)
              pep440 = f"{base}.post{build}"

          current = re.search(
              r'^version = "([^"]+)"', Path("pyproject.toml").read_text(), re.M
          )
          if current is None:
              sys.exit("::error::no version line in pyproject.toml")

          try:
              new, old = Version(pep440), Version(current.group(1))
          except InvalidVersion as exc:
              sys.exit(f"::error::{exc}")

          if new > old:
              print(f"{old} -> {new}")
          elif new == old:
              sys.exit(
                  f"::error::version {new} is already what the tree says. "
                  f"Re-releasing the same number publishes different code "
                  f"under one version. Use a .postN suffix."
              )
          else:
              sys.exit(
                  f"::error::version {new} is OLDER than the tree's {old}. "
                  f"Publishing it would make main claim a release that "
                  f"predates its own code. If you really mean to roll back, "
                  f"re-run with allow_downgrade."
              )
          GUARD

      - name: Bump versions in source
        run: |
          v='${{ inputs.version }}'
          # Convert postr to PEP 440 compliant .post format for pyproject.toml
          pep440_v=$(echo "$v" | sed 's/postr/.post/g')
          # Convert a bare "-N" rebuild suffix (e.g. 0.70.6-2) to PEP 440's
          # post-release form (0.70.6.post2). PyPI requires strict PEP 440
          # and rejects a raw hyphen-number suffix, but .postN is exactly
          # PEP 440's own mechanism for "rebuild of an already-released
          # version" -- which is what this input is for. The raw "-2" form
          # is kept for the git tag and __version__ below.
          pep440_v=$(echo "$pep440_v" | sed -E 's/-([0-9]+)$/.post\1/')
          python - <<PY
          import re
          from pathlib import Path

          v = "${{ inputs.version }}"
          pep440_v = "$pep440_v"

          p = Path("pyproject.toml")
          p.write_text(re.sub(r'^version = "[^"]+"', f'version = "{pep440_v}"', p.read_text(), count=1, flags=re.M))

          s = Path("setup.cfg")
          s.write_text(re.sub(r'^version = .+$', f'version = {pep440_v}', s.read_text(), count=1, flags=re.M))

          init = Path("src/hypernix/__init__.py")
          init.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{v}"', init.read_text(), count=1))
          PY
          echo "--- pyproject.toml version line"
          grep '^version' pyproject.toml
          echo "--- setup.cfg version line"
          grep '^version' setup.cfg
          echo "--- __init__.py version line"
          grep __version__ src/hypernix/__init__.py

      - name: Lint
        run: ruff check src/hypernix

      - name: Tests
        run: PYTHONPATH=src pytest -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: twine check --strict dist/*

      - name: Determine changelog baseline
        id: baseline
        run: |
          if [ '${{ steps.classify.outputs.prerelease }}' = "false" ]; then
            # Cutting a stable release: compare against the last STABLE tag,
            # skipping over any prereleases in between (e.g. v0.71.4b6,
            # v0.71.4b7, v0.71.4b8 between two stable cuts) — otherwise
            # "commits since the last release" would only show the diff
            # from the most recent beta, not everything that actually
            # shipped since the last stable version. --sort=-v:refname is
            # version-aware (not creation-date-aware), so re-tagging an
            # older commit later can't put it ahead of a newer version.
            baseline=""
            for t in $(git tag --list 'v*' --sort=-v:refname); do
              if ! [[ "$t" =~ (rc|pre|alpha|beta|a|b|postr)[0-9]*$ ]]; then
                baseline="$t"
                break
              fi
            done
          else
            # Prereleases keep the simple "since the immediately preceding
            # tag" behavior — an incremental changelog per beta iteration,
            # not a re-diff against the last stable release each time.
            baseline=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "::notice::changelog baseline: ${baseline:-<none, first release>}"

      - name: Generate CHANGELOG fragment
        id: changelog
        run: |
          last='${{ steps.baseline.outputs.baseline }}'
          {
            echo "## Changelog"
            echo "![PyPI - Downloads](https://img.shields.io/pypi/dm/hypernix)"
            echo "![PyPI - Version](https://img.shields.io/pypi/v/hypernix)"
            echo ""
            if [ -n "$last" ]; then
              if [ '${{ steps.classify.outputs.prerelease }}' = "false" ]; then
                echo "Commits since the last stable release (\`$last\`):"
              else
                echo "Commits since \`$last\`:"
              fi
              echo ""
              git log "$last..HEAD" --pretty='- %s (%h)' --no-merges
            else
              echo "Initial tagged release."
            fi
          } > CHANGELOG_FRAGMENT.md
          echo "--- fragment ---"
          cat CHANGELOG_FRAGMENT.md

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.whl *.tar.gz | tee SHA256SUMS

      - name: Update Release Timeline
        run: |
          python - <<'PY'
          import os, subprocess
          from datetime import date
          from pathlib import Path
          
          version = "${{ inputs.version }}"
          timeline_path = Path("wiki/Release-Timeline.md")
          
          # Same baseline the changelog fragment used (last STABLE tag when
          # this release itself is stable, skipping over any prereleases in
          # between; last tag period when this release is itself a
          # prerelease) — computed once in the "Determine changelog
          # baseline" step so the two never disagree.
          last_tag = "${{ steps.baseline.outputs.baseline }}"
          
          if last_tag:
              log_cmd = subprocess.run(["git", "log", f"{last_tag}..HEAD", "--pretty=%h - %s", "--no-merges"], capture_output=True, text=True)
          else:
              log_cmd = subprocess.run(["git", "log", "--pretty=%h - %s", "--no-merges"], capture_output=True, text=True)
          
          commits = [line for line in log_cmd.stdout.split('\n') if line.strip()]
          
          if not timeline_path.exists():
              timeline_path.parent.mkdir(exist_ok=True)
              timeline_path.write_text("# HyperNix Release Timeline\n\n")
          
          content = f"## Release v{version} ({date.today().isoformat()})\n\n"
          content += "```mermaid\n"
          content += "timeline\n"
          content += f"    title Release v{version} Commits\n"
          
          if not commits:
              content += f"    {version} : No commits found\n"
          else:
              content += f"    {version}\n"
              for c in commits[:15]:
                  c_clean = c.replace(':', '-').replace('"', "'")
                  content += f"        : {c_clean}\n"
          content += "```\n\n"
          
          existing = timeline_path.read_text() if timeline_path.exists() else ""
          timeline_path.write_text(existing + content)
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-release-${{ inputs.dry_run && 'dryrun-' || '' }}${{ inputs.version }}
          path: |
            dist/
            CHANGELOG_FRAGMENT.md
          retention-days: 14

      - name: Commit version bump
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml setup.cfg src/hypernix/__init__.py wiki/Release-Timeline.md
          if git diff --cached --quiet; then
            echo "::notice::no version change to commit (already at v${{ inputs.version }})"
          else
            git commit -m "hypernix v${{ inputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          tag='${{ steps.classify.outputs.tag }}'
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::notice::tag $tag already exists; skipping tag push"
          else
            git tag -a "$tag" -F CHANGELOG_FRAGMENT.md
            git push origin "$tag"
            echo "::notice::pushed $tag"
          fi

  # ---------------------------------------------------------------------------
  # Create the GitHub Release and attach the built artifacts + SHA256SUMS.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Live integration: a real server, a real key, a fake model.
  # ---------------------------------------------------------------------
  #
  # Two jobs run after `cut` has built and tested the release, each minting
  # its own T2 key and
  # tearing it down afterwards. One drives the API; the other drives the
  # iPhone app.
  #
  # A note on the shape, because it is not the obvious one. Hosted runners
  # cannot reach each other over the network, so "job A hosts the server,
  # job B connects to it" is not expressible here — there is no route
  # between two runners. Each job therefore brings up the server it needs
  # on its own runner. The split that matters is preserved: one job proves
  # the API works against a client that authenticates from outside the
  # process, the other proves the app works against a real server, and the
  # release waits on both.
  #
  # The model is a stub speaking the OpenAI shape rather than a mock
  # patched into the bridge, so the bridge, the routing engine and the
  # serialisation are all the real ones. A mock would prove the mock works.

  integration-api:
    name: integration — live API + fake model
    needs: cut
    if: ${{ !inputs.skip_integration }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Both halves must agree on where the keys live. The server reads
      # T1_KEYMASTER_DIR and so does gkey; leaving either to infer it from
      # $HOME is how a key gets minted into a store the server is not
      # reading, which looks exactly like a rejected key.
      T1_KEYMASTER_DIR: ${{ github.workspace }}/.ci-keys
      T1_DB_PATH: ${{ github.workspace }}/.ci-t1.sqlite3
      T1_HYPERLINK_ENABLED: "1"
      T1_LMSTUDIO_ENABLED: "1"
      T1_LMSTUDIO_URL: http://127.0.0.1:1234
      T1_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the server extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[t1api]'

      - name: Start the fake model
        run: |
          nohup python scripts/ci/fake_model_server.py --port 1234 \
            > fake-model.log 2>&1 &
          python scripts/ci/wait_for_http.py http://127.0.0.1:1234/v1/models \
            --timeout 60 --name "the fake model" --log fake-model.log

      - name: Start the T1 API
        run: |
          export T1_TOKEN_SECRET="$(python -c 'import secrets;print(secrets.token_hex(32))')"
          echo "T1_TOKEN_SECRET=$T1_TOKEN_SECRET" >> "$GITHUB_ENV"
          nohup python -m uvicorn hypernix.t1api.app:create_app --factory \
            --host 127.0.0.1 --port 8000 > t1api.log 2>&1 &
          python scripts/ci/wait_for_http.py http://127.0.0.1:8000/health \
            --timeout 90 --name "the T1 API" --log t1api.log

      - name: Mint a key, authorise it, and chat through the fake model
        run: python scripts/ci/integration_probe.py --url http://127.0.0.1:8000

      - name: Shut it down and prove no keys are left behind
        if: always()
        run: |
          pkill -f 'uvicorn hypernix.t1api' || true
          pkill -f fake_model_server || true
          remaining="$(ls -1 "$T1_KEYMASTER_DIR"/*.json 2>/dev/null | wc -l | tr -d ' ')"
          echo "keys still in the store: $remaining"
          # The bootstrap key is expected — it is loopback-only and expires
          # in three days. Anything the probe minted must be gone.
          if [ "$remaining" -gt 1 ]; then
            echo "::error::the probe left ${remaining} keys behind"
            ls -la "$T1_KEYMASTER_DIR" || true
            exit 1
          fi
          rm -rf "$T1_KEYMASTER_DIR" "$T1_DB_PATH"

      - name: Server logs (on failure)
        if: failure()
        run: |
          echo '--- t1api ---'; tail -n 100 t1api.log || true
          echo '--- fake model ---'; tail -n 40 fake-model.log || true

  integration-ios:
    name: integration — iPhone simulator + live API
    needs: cut
    if: ${{ !inputs.skip_integration }}
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      T1_KEYMASTER_DIR: ${{ github.workspace }}/.ci-keys
      T1_DB_PATH: ${{ github.workspace }}/.ci-t1.sqlite3
      T1_HYPERLINK_ENABLED: "1"
      T1_LMSTUDIO_ENABLED: "1"
      T1_LMSTUDIO_URL: http://127.0.0.1:1234
      T1_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the server extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[t1api]'

      - name: Start the fake model and the T1 API
        run: |
          nohup python scripts/ci/fake_model_server.py --port 1234 > fake-model.log 2>&1 &
          export T1_TOKEN_SECRET="$(python -c 'import secrets;print(secrets.token_hex(32))')"
          echo "T1_TOKEN_SECRET=$T1_TOKEN_SECRET" >> "$GITHUB_ENV"
          nohup python -m uvicorn hypernix.t1api.app:create_app --factory \
            --host 127.0.0.1 --port 8000 > t1api.log 2>&1 &
          # Both, not just the API. This job used to wait only for port
          # 8000, and a macOS runner is slow enough starting a Python
          # process that the probe reached the bridge before the fake
          # model was listening — which fails as MODEL_UNAVAILABLE and
          # reads as a broken bridge rather than a race.
          python scripts/ci/wait_for_http.py http://127.0.0.1:1234/v1/models \
            --timeout 90 --name "the fake model" --log fake-model.log
          python scripts/ci/wait_for_http.py http://127.0.0.1:8000/health \
            --timeout 90 --name "the T1 API" --log t1api.log

      - name: Mint this job's own key and check the API from outside
        run: python scripts/ci/integration_probe.py --url http://127.0.0.1:8000

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Boot an iPhone simulator
        id: sim
        run: |
          device="$(python3 ios/scripts/pick_simulator.py)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          echo "picked: $device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b || true

      - name: Build and test the app on the simulator
        run: |
          cd ios
          xcodebuild test \
            -project HyperLink.xcodeproj \
            -scheme HyperLink \
            -destination "id=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild test \
            -project HyperLink.xcodeproj \
            -scheme HyperLink \
            -destination "id=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Shut it all down and delete the keys
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -f 'uvicorn hypernix.t1api' || true
          pkill -f fake_model_server || true
          remaining="$(ls -1 "$T1_KEYMASTER_DIR"/*.json 2>/dev/null | wc -l | tr -d ' ')"
          echo "keys still in the store: $remaining"
          if [ "$remaining" -gt 1 ]; then
            echo "::error::the probe left ${remaining} keys behind"
            exit 1
          fi
          rm -rf "$T1_KEYMASTER_DIR" "$T1_DB_PATH"

      - name: Logs (on failure)
        if: failure()
        run: |
          echo '--- t1api ---'; tail -n 100 t1api.log || true
          echo '--- fake model ---'; tail -n 40 fake-model.log || true

  github-release:
    name: GitHub Release
    needs: [cut, integration-api, integration-ios]
    if: >-
      always() &&
      needs.cut.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.integration-api.result) &&
      contains(fromJSON('["success","skipped"]'), needs.integration-ios.result) &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-release-${{ inputs.version }}
          path: .

      - name: Show artifacts
        run: ls -lah dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.cut.outputs.tag }}
          name: hypernix ${{ needs.cut.outputs.tag }}
          prerelease: ${{ needs.cut.outputs.prerelease == 'true' }}
          body_path: CHANGELOG_FRAGMENT.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

  # ---------------------------------------------------------------------------
  # Publish stable tags to real PyPI via Trusted Publishing (OIDC).
  # Requires configuring the PyPI project with:
  #   publisher = GitHub
  #   repo      = trail-b1az3r/hypernix-pip
  #   workflow  = public-release.yml
  #   environment = pypi
  # ---------------------------------------------------------------------------
  pypi-publish:
    name: publish to PyPI
    needs: [cut, integration-api, integration-ios]
    if: >-
      always() &&
      needs.cut.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.integration-api.result) &&
      contains(fromJSON('["success","skipped"]'), needs.integration-ios.result) &&
      !inputs.dry_run &&
      !inputs.skip_pypi &&
      needs.cut.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/hypernix/
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-release-${{ inputs.version }}
          path: .

      - name: Strip non-PyPI files
        run: |
          cd dist
          rm -f SHA256SUMS
          ls -lah

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Publish prereleases to TestPyPI. Same OIDC setup, different environment.
  # ---------------------------------------------------------------------------
  testpypi-publish:
    name: publish to TestPyPI
    needs: [cut, integration-api, integration-ios]
    if: >-
      always() &&
      needs.cut.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.integration-api.result) &&
      contains(fromJSON('["success","skipped"]'), needs.integration-ios.result) &&
      !inputs.dry_run &&
      !inputs.skip_pypi &&
      needs.cut.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hypernix/
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-release-${{ inputs.version }}
          path: .

      - name: Strip non-PyPI files
        run: |
          cd dist
          rm -f SHA256SUMS
          ls -lah

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
