# Build the HyperLink iOS app and package it as an .ipa.
#
# Callable three ways:
#   * on a push/PR that touches ios/  — build + test, artifact only
#   * workflow_dispatch                — same, on demand
#   * workflow_call                    — from release.yml, so the IPA
#                                        ships with the Python release
#
# Signing
# -------
# The default build is **unsigned**: CI has no Apple Developer identity
# and a workflow that requires one cannot run on a fork or for anyone
# who has not set up secrets. An unsigned IPA is installable with
# AltStore, Sideloadly, or a free Xcode signing profile, which is how
# this app is distributed.
#
# When the four signing secrets *are* present the job signs properly and
# exports a distributable IPA instead. The two paths differ only in the
# export step; everything before it is identical, so an unsigned build
# is a real test of the signed one.
name: ios

on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the unit tests on a simulator"
        type: boolean
        default: true
      local_engine:
        description: "Build llama.cpp into the app so it can run models on-device. Adds 15-25 minutes."
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_tests:
        description: "Run the unit tests on a simulator"
        type: boolean
        default: false
      local_engine:
        description: "Build llama.cpp into the app so it can run models on-device."
        type: boolean
        # True for a *called* build, unlike the dispatch default below.
        # The only reason to call this workflow is to ship the result,
        # and an IPA that cannot run a model is not worth shipping. The
        # expensive default is the safe one here; the cheap default
        # belongs on the PR path, where it is.
        default: true
      version:
        description: "Marketing version to stamp into the build"
        type: string
        default: ""
    outputs:
      ipa_artifact:
        description: "Name of the uploaded IPA artifact"
        value: ${{ jobs.build.outputs.ipa_artifact }}
      signed:
        description: "Whether the IPA is signed"
        value: ${{ jobs.build.outputs.signed }}

# Cancel superseded runs on a branch, never on main.
#
# `cancel-in-progress: true` everywhere is right for a PR -- a ten
# minute macOS build of a commit nobody is looking at any more is pure
# waste. On main it is the opposite: every merge is a distinct commit
# whose IPA somebody may want, and a busy afternoon of merges means each
# build is killed by the next one. Runs 30, 31, 33, 34 and 36 were all
# cancelled that way, so main went a whole day without ever producing a
# verified IPA -- while the released one was crashing on launch.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build HyperLink.ipa
    # macos-15 carries the Xcode 16/26 line. The app's deployment target
    # is iOS 18, so it builds on any of them; the iOS 27 SDK is picked up
    # automatically when the runner image ships it (see "Select Xcode").
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      ipa_artifact: ${{ steps.package.outputs.artifact_name }}
      signed: ${{ steps.signing.outputs.available }}
      version: ${{ steps.version.outputs.marketing }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Take the newest Xcode the runner has rather than pinning a
          # version that will be removed from the image in three months.
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::No Xcode found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          echo "--- SDKs ---"
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          # The .xcodeproj is generated, not committed — see ios/project.yml.
          brew install xcodegen
          xcodegen --version

      - name: Work out the version to stamp
        id: version
        run: |
          set -euo pipefail
          # The app's marketing version tracks the T1 API's year.month
          # (1.0.26.8.x), which is what the server reports and what a
          # support question will quote. CFBundleVersion is the run
          # number, which is monotonic and unique — App Store Connect
          # and TestFlight both require that.
          supplied="${{ inputs.version }}"
          if [ -n "$supplied" ]; then
            marketing="$supplied"
          else
            marketing="$(python3 ios/scripts/app_version.py)"
          fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "::notice::HyperLink $marketing (build ${GITHUB_RUN_NUMBER})"

      # Off by default, and deliberately so: it clones llama.cpp and
      # compiles it for two slices, which is 15-25 minutes on a hosted
      # macOS runner and is not worth paying on a PR that touched a
      # view. Without it the app builds and ships with EchoRunner,
      # which tells the user this build has no local engine.
      # Every trigger gets a stated answer, because the obvious
      # expression does not have one.
      #
      # `if: ${{ inputs.local_engine }}` was the whole engine-skipping
      # bug, and it looks correct. The `inputs` context exists *only*
      # for `workflow_dispatch` and `workflow_call`; on a `push` or a
      # `pull_request` it is not populated at all, so
      # `inputs.local_engine` is null, null is falsy, and the step was
      # skipped on every single commit to main -- silently, with a grey
      # "skipped" in the log that looks exactly like a deliberate one.
      # `--require-engine` was gated on the same expression, so the
      # guard that exists to catch this was switched off by it too.
      #
      # Every commit to main therefore shipped an app whose on-device
      # inference was EchoRunner. That is the "it always skips the
      # inference engine build" report, and setting the workflow_call
      # default to true (which fixed the release path) could not have
      # fixed it: the release path was never the one skipping.
      - name: Decide whether to build the engine
        id: engine
        env:
          REQUESTED: ${{ inputs.local_engine }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # REQUESTED is "true", "false", or empty when there is no
          # `inputs` context to read. Empty is the case that has to be
          # decided here rather than defaulted to false by accident.
          case "$REQUESTED" in
            true)  want=true ;;
            false) want=false ;;
            *)
              # No input: the trigger decides. main is what people
              # install from and it gets a real engine; a pull request
              # does not, because 15-25 minutes on every push is what
              # makes somebody turn this off permanently.
              if [ "$EVENT" = "push" ]; then want=true; else want=false; fi
              ;;
          esac
          echo "Engine requested: '${REQUESTED:-<no inputs context>}' on $EVENT -> $want"
          echo "build=$want" >> "$GITHUB_OUTPUT"

      - name: Build the inference engine
        if: steps.engine.outputs.build == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          ./scripts/build_llama_xcframework.sh
          echo "--- what was built ---"
          cat vendor/llama.xcframework.json
          echo "--- the flag the project reads ---"
          cat vendor/LocalLlama.xcconfig

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          # Decides whether the spec carries the llama.xcframework
          # dependency, from whether the framework is actually there.
          # XcodeGen cannot make that call: its `optional: true` means
          # weak linking, not "skip when absent", so a spec that always
          # names the framework fails to build on a checkout without it.
          # --require-engine when the build asked for one, so a failed
          # or skipped engine step fails here instead of shipping an IPA
          # in which every on-device feature quietly does nothing.
          python3 scripts/prepare_project.py \
            ${{ steps.engine.outputs.build == 'true' && '--require-engine' || '' }}
          xcodegen generate --spec project.generated.yml
          ls -la HyperLink.xcodeproj

      - name: Do we have signing secrets?
        id: signing
        env:
          CERT: ${{ secrets.IOS_DIST_CERTIFICATE_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets present — producing a signed IPA"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets — producing an unsigned IPA (sideload with AltStore/Sideloadly)"
          fi

      - name: Run the unit tests
        if: inputs.run_tests != false
        working-directory: ios
        run: |
          set -euo pipefail
          # Pick whichever iPhone simulator the runner actually has
          # rather than naming one: the available devices change with
          # every image update, and a hard-coded name is the single most
          # common reason an iOS workflow starts failing on its own.
          device="$(python3 scripts/pick_simulator.py || true)"
          if [ -z "$device" ]; then
            echo "::warning::No iPhone simulator on this runner — skipping tests"
            exit 0
          fi
          echo "Testing on simulator $device"
          set -o pipefail
          # The whole log to a file, and only a summary to the console.
          #
          # This used to be `| tail -60`, which discards exactly what is
          # needed when the build fails: xcodebuild prints a short
          # "Testing failed:" summary of *deduplicated* messages and
          # then the per-file errors with their line numbers, and the
          # tail keeps the wrong end. A compile failure would report six
          # unique messages and one file:line, so fixing it took a round
          # trip per error.
          #
          # Now every `error:` line is echoed first, in full, and the
          # complete log is uploaded as an artifact.
          # The redirect below needs the directory to exist first.
          mkdir -p build
          set +e
          xcodebuild test \
            -project HyperLink.xcodeproj \
            -scheme HyperLink \
            -configuration Debug \
            -destination "id=$device" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Every compiler error"
            # Sorted and deduplicated: a batch build repeats the same
            # error once per file that triggered it, and forty copies of
            # one message buries the other five.
            grep -E "(error|warning): " build/xcodebuild.log \
              | sed 's|/Users/runner/work/HyperNix-pip/HyperNix-pip/||' \
              | sort -u \
              | head -200 || true
            echo "::endgroup::"
            echo "::group::The last 200 lines"
            tail -200 build/xcodebuild.log
            echo "::endgroup::"
            echo "::error::xcodebuild failed — see the groups above, or the ios-build-log artifact"
          else
            tail -20 build/xcodebuild.log
          fi
          exit "$status"

      - name: Archive
        working-directory: ios
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          set -o pipefail
          extra=()
          if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
            extra+=(CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO)
          else
            extra+=(DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}")
          fi
          xcodebuild archive \
            -project HyperLink.xcodeproj \
            -scheme HyperLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HyperLink.xcarchive \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${extra[@]}" \
            | tail -40

      - name: Import the signing identity
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/hyperlink-signing.keychain-db"
          # A random, one-shot keychain password: this keychain exists
          # for the length of one job and is never written anywhere.
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$PROFILE" | base64 --decode > "$profiles/hyperlink.mobileprovision"

      # The check that would have caught the crash-on-launch.
      #
      # `com.apple.developer.carplay-communication` is a restricted
      # entitlement: it must be in the provisioning profile, and Apple
      # grants it per app on request. An app signed with one it does not
      # hold is killed at launch by amfid -- EXC_CRASH (SIGKILL),
      # CODESIGNING -- before any of its own code runs.
      #
      # Xcode writes archived-expanded-entitlements.xcent into the .app
      # when archiving, and that is what AltStore and Sideloadly read to
      # decide what to request when they re-sign. So an unsigned IPA can
      # still carry the demand for an entitlement the sideloader cannot
      # be granted, and the app dies on the phone having passed every
      # test -- the simulator does not enforce entitlements, so nothing
      # before a device can see it.
      #
      # This looks at the bundle that is about to ship rather than at the
      # project that produced it.
      # Every dylib the app links must be inside the bundle.
      #
      # This is the check that would have caught the crash that made it
      # exist. llama.framework is dynamic -- upstream combines its static
      # libs into one dylib with install_name @rpath/llama.framework/llama
      # -- and it was configured as `embed: false`, so the app linked
      # something that was never copied in. dyld killed it at launch:
      #
      #     namespace: DYLD, indicator: "Library missing"
      #     Library not loaded: @rpath/llama.framework/llama
      #
      # The simulator tests could not see it. `xcodebuild test` sets
      # DYLD_FRAMEWORK_PATH to the built products directory, so the
      # framework resolves there whether or not it was embedded. Only a
      # device -- or this check, against the archive -- can tell.
      - name: Every linked framework is actually in the bundle
        id: frameworks
        working-directory: ios
        run: |
          set -euo pipefail
          app="build/HyperLink.xcarchive/Products/Applications/HyperLink.app"
          binary="$app/HyperLink"
          [ -f "$binary" ] || { echo "::error::no app binary in the archive"; exit 1; }

          echo "::group::@rpath dylibs the binary asks for"
          rpaths="$(otool -L "$binary" | awk '/@rpath\//{print $1}' || true)"
          echo "${rpaths:-（none）}"
          echo "::endgroup::"

          missing=""
          for ref in $rpaths; do
            # @rpath/llama.framework/llama -> Frameworks/llama.framework/llama
            rel="${ref#@rpath/}"
            if [ ! -f "$app/Frameworks/$rel" ]; then
              missing="$missing $ref"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::group::what is in Frameworks/"
            ls -la "$app/Frameworks" 2>/dev/null || echo "(no Frameworks directory at all)"
            echo "::endgroup::"
            echo "::error::the app links these @rpath libraries and none of" \
                 "them is in the bundle:$missing — dyld will kill it at launch." \
                 "A framework dependency needs embed: true."
            exit 1
          fi
          count="$(echo "$rpaths" | grep -c . || true)"
          echo "every @rpath library the binary links ($count) is embedded"
          if [ "$count" = "0" ]; then
            # Not a failure -- an engine-less build links no dylib at all --
            # but saying "0 embedded" as though it were a clean bill of
            # health is how a vacuous check gets mistaken for coverage.
            echo "verdict=no @rpath libraries linked (no engine in this build)" \
              >> "$GITHUB_OUTPUT"
          else
            echo "verdict=$count linked, all embedded" >> "$GITHUB_OUTPUT"
          fi

      - name: No restricted entitlements in an unsigned build
        id: entitlements
        if: steps.signing.outputs.available != 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          app="build/HyperLink.xcarchive/Products/Applications/HyperLink.app"
          echo "::group::What is actually in the bundle"
          ls -la "$app" || { echo "::error::no .app in the archive"; exit 1; }
          echo "--- anything entitlement-shaped, anywhere in it ---"
          find "$app" \( -name '*.xcent' -o -name '*.mobileprovision' \
                         -o -name 'embedded.provisionprofile' \) -print || true
          echo "::endgroup::"

          # Report which case this is rather than passing silently.
          #
          # An unsigned archive may legitimately contain no entitlements
          # file at all: CODE_SIGNING_ALLOWED=NO skips the step that
          # writes one. A check that just greps and exits 0 cannot tell
          # that apart from "checked it and it was clean", and a check
          # that cannot fail is not coverage.
          carriers="$(find "$app" \( -name '*.xcent' -o -name '*.mobileprovision' \
                                      -o -name 'embedded.provisionprofile' \) 2>/dev/null || true)"
          if [ -z "$carriers" ]; then
            echo "::notice::this unsigned archive carries no entitlements file" \
                 "at all, so nothing can demand CarPlay of a sideloader." \
                 "Whatever re-signs it supplies its own entitlements."
            echo "verdict=none present — nothing in the bundle can demand CarPlay" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          found=""
          for path in $carriers; do
            echo "::group::$(basename "$path")"
            plutil -p "$path" 2>/dev/null || strings "$path" | head -40
            echo "::endgroup::"
            if grep -qa "carplay" "$path"; then
              found="$found $(basename "$path")"
            fi
          done
          if [ -n "$found" ]; then
            echo "::error::this unsigned build ships a CarPlay entitlement" \
                 "($found). A sideloader cannot be granted it, so the app" \
                 "is killed at launch."
            exit 1
          fi
          count="$(echo "$carriers" | wc -l | tr -d ' ')"
          echo "checked $count file(s): no CarPlay entitlement"
          echo "verdict=$count file(s) present, none demanding CarPlay" \
            >> "$GITHUB_OUTPUT"

      - name: Package the IPA
        id: package
        working-directory: ios
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p build/output

          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            method="${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}"
            team="${{ secrets.IOS_TEAM_ID }}"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "<key>method</key><string>${method}</string>" \
              "<key>teamID</key><string>${team}</string>" \
              '<key>signingStyle</key><string>manual</string>' \
              '<key>compileBitcode</key><false/>' \
              '<key>stripSwiftSymbols</key><true/>' \
              '<key>destination</key><string>export</string>' \
              '</dict></plist>' > build/ExportOptions.plist
            xcodebuild -exportArchive \
              -archivePath build/HyperLink.xcarchive \
              -exportOptionsPlist build/ExportOptions.plist \
              -exportPath build/output | tail -20
            suffix=""
          else
            # No signing identity: build the IPA layout by hand. An .ipa
            # is a zip with the .app inside a top-level Payload/
            # directory and nothing else — Sideloadly and AltStore
            # re-sign from exactly this.
            app="build/HyperLink.xcarchive/Products/Applications/HyperLink.app"
            if [ ! -d "$app" ]; then
              echo "::error::Archive produced no HyperLink.app"
              find build/HyperLink.xcarchive -maxdepth 4 -name '*.app' || true
              exit 1
            fi
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$app" build/Payload/
            (cd build && zip -qry output/HyperLink.ipa Payload)
            rm -rf build/Payload
            suffix="-unsigned"
          fi

          produced="$(ls build/output/*.ipa | head -1)"
          final="build/output/HyperLink-${MARKETING}-b${BUILD_NUMBER}${suffix}.ipa"
          [ "$produced" = "$final" ] || mv "$produced" "$final"
          shasum -a 256 "$final" | tee build/output/SHA256SUMS.ios

          name="hyperlink-ipa-${MARKETING}-b${BUILD_NUMBER}"
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"
          echo "ipa_path=ios/$final" >> "$GITHUB_OUTPUT"
          ls -lah build/output/

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ios/build/output/*.ipa
            ios/build/output/SHA256SUMS.ios
          if-no-files-found: error
          retention-days: 90

      - name: Upload the build log
        if: always() && inputs.run_tests != false
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_number }}
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the test results
        if: always() && inputs.run_tests != false
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_number }}
          path: ios/build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          {
            echo "### HyperLink iOS"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$MARKETING\` (build ${GITHUB_RUN_NUMBER}) |"
            echo "| signed | ${{ steps.signing.outputs.available }} |"
            echo "| artifact | \`${{ steps.package.outputs.artifact_name }}\` |"
            echo "| entitlements | ${{ steps.entitlements.outputs.verdict || 'not checked (signed build)' }} |"
            echo "| frameworks | ${{ steps.frameworks.outputs.verdict || 'not checked' }} |"
            echo
            if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
              echo "The IPA is **unsigned**. Install it with AltStore or Sideloadly,"
              echo "or re-sign it with your own free Apple ID profile in Xcode."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
