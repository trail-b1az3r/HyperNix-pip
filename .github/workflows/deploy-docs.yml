name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'wiki/**'
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      # The security page (#/security) is a scan of the code, so code
      # changes rebuild it too.
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/hypernix-security-scan.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed
    branches:
      - main
  schedule:
    # Runs at 00:05 UTC every day for auto-updating content
    - cron: '5 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package.json

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: |
          cd docs
          npm ci

      # The security page: what the repository's own scanners find in this
      # commit (the T1 audit, Bandit, Semgrep, OSV), written to
      # docs/public/v1/security.json for the build below. A scanner that
      # fails is reported as failed on the page; it does not stop the docs.
      - name: Set up Python for the security scan
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Security scan for the site
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          python -m pip install --quiet "bandit[toml]" semgrep
          python scripts/security_report.py --out docs/public/v1/security.json

      - name: Build documentation
        run: |
          cd docs
          npm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
